name: News

# Hourly: gathers headlines, podcast episodes and the NBA's highlight videos into data/news/index.json
# (scripts/news.py, public feeds only) and commits it. The site reads that file straight from the repository, so
# news shows up without rebuilding the site. GitHub starts scheduled runs late and sometimes skips them; an outside
# timer (cron-job.org) can press "Run workflow" instead.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gather news, podcasts and highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional, only used when YouTube's feed fails
        run: python scripts/news.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "News $(date -u +%Y-%m-%dT%H:%MZ)"
          # this job is the only writer of data/news, so on a conflict its own newer files win
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
